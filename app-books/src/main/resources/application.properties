# Configuración del datasource para PostgreSQL DOCKER
quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/distribuidaH

# Habilitar el uso de Hibernate ORM
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.show-sql=true
quarkus.hibernate-orm.log.format-sql=true

# PUERTO
quarkus.http.port=6060

# -----------ESTATICO
#quarkus.stork.authors-api.service-discovery.type=static
#quarkus.stork.authors-api.service-discovery.address-list=localhost:7070

# ----------DINAMICO
consul.host=127.0.0.1
consul.port=8500
quarkus.stork.authors-api.service-discovery.type=consul
quarkus.stork.authors-api.service-discovery.consul-host=${consul.host}
quarkus.stork.authors-api.service-discovery.consul-port=${consul.port}
quarkus.stork.authors-api.service-discovery.application=app-authors
quarkus.stork.authors-api.service-discovery.refresh-period=5s

# Configuracion de al salud de mi app con HEALTH
quarkus.smallrye-health.ui.enable=true

# Configuración CORS para Quarkus
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS