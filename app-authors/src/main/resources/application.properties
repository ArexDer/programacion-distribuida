# Configuración del datasource para PostgreSQL
quarkus.datasource.db-kind=postgresql

quarkus.datasource.username=postgres
quarkus.datasource.password=1234
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/distribuidaH

#quarkus.datasource.username=postgres
#quarkus.datasource.password=postgres
#quarkus.datasource.jdbc.url=jdbc:postgresql://dbserver:5432/distribuidaF

# Hibernate ORM con generación automática de esquema
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.show-sql=true
quarkus.hibernate-orm.log.format-sql=true

#quarkus.hibernate-orm.database.generation=update
#quarkus.hibernate-orm.log.sql=true

# API ROOT PATH opcional
#quarkus.http.root-path=/decimo/v1.1

# PUERTO
quarkus.http.port=7070


quarkus.flyway.baseline-at-start=true
quarkus.flyway.migrate-at-start=true

#configuracion consul
consul.host =127.0.0.1
consul.port= 8500


# Configuracion de al salud de mi app con HEALTH
quarkus.smallrye-health.ui.enable=true

# Configuración CORS para Quarkus

quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELE TE,OPTIONS