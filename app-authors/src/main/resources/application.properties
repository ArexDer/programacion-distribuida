# Configuración del datasource para PostgreSQL
quarkus.datasource.db-kind=postgresql

# Conexión en MODO DEV con Docker
#quarkus.datasource.username=postgres
#quarkus.datasource.password=1234
#quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/distribuidaF

quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/distribuidaF

# Flyway (migración de base de datos)
quarkus.flyway.baseline-at-start=false
quarkus.flyway.migrate-at-start=false
quarkus.flyway.locations=db/migration

# Hibernate ORM deshabilitado para generación automática si usás Flyway
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# API ROOT PATH opcional
#quarkus.http.root-path=/decimo/v1.1

# PUERTO
quarkus.http.port=7070

#configuracion consul

consul.host =127.0.0.1
consul.port= 8500


# Configuracion de al salud de mi app con HEALTH
quarkus.smallrye-health.ui.enable=true

# Configuración CORS para Quarkus
quarkus.http.cors.origins=*
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS

